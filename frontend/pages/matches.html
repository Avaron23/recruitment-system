<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/matches.css">
    <title>Recruitment System</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Главное</a>
            <a href="./candidates.html">Кандидаты</a>
            <a href="./vacancies.html">Вакансии</a>
            <a href="./matches.html">Совпадения</a>
            <a href="./ranking.html">Ранжирование</a>
            <a href="./settings.html">Настройки</a>
        </nav>
    </header>
    <main>
        <div class="matches-container">
            <div class="matches-header">
                <h1>Совпадения (Мэтчи)</h1>
                <button class="btn-create-match" onclick="openMatchForm()">+ Создать мэтч</button>
                <button class="btn-create-match" onclick="createMatchesByVacancy()">+ Создать мэтчи по вакансии</button>
                <button class="btn-delete-matches" onclick="deleteAllMatches()">- Удалить все мэтчи</button>
                <button class="btn-delete-matches" onclick="deleteMatchesByVacancy()">- Удалить мэтчи по вакансии</button>
            </div>

            <div class="matches-list" id="matchesList">
                <!-- Карточки матчей будут добавляться сюда -->
            </div>

            <!-- Модальное окно для создания матча -->
            <div class="overlay" id="matchFormOverlay">
                <div class="form-container">
                    <h2>Создать совпадение(мэтч)</h2>
                    
                    <label>Кандидат</label>
                    <select id="formCandidate" required>
                        <option value="">Выберите кандидата...</option>
                    </select>

                    <label>Вакансия</label>
                    <select id="formVacancy" required>
                        <option value="">Выберите вакансию...</option>
                    </select>

                    <div class="form-buttons">
                        <button type="button" id="formSubmit" class="btn-submit">Создать</button>
                        <button type="button" id="formCancel" class="btn-cancel">Отмена</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="../scripts/matches.js"></script>
</body>
</html>
