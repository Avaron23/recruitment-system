<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/vacancies.css">
    <title>Recruitment System</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Главное</a>
            <a href="./candidates.html">Кандидаты</a>
            <a href="./vacancies.html">Вакансии</a>
            <a href="./matches.html">Совпадения</a>
            <a href="./ranking.html">Ранжирование</a>
            <a href="./settings.html">Настройки</a>
        </nav>
    </header>
    <main>
        <div class="vacancies-table">
            <h1>Таблица вакансий</h1>
            <table class="table" id="vacanciesTable">
                <thead>
                    <tr>
                        <th>id</th> 
                        <th>Название</th> 
                        <th>Требуемый опыт</th>
                        <th>Требуемое образование</th>
                        <th>Обязательные навыки</th>
                        <th>Желательные навыки</th>
                        <th>Зарплата</th>
                        <th>Требуемая готовность переехать</th>
                        <th>Изменить</th>
                        <th>Удалить</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>

            <!-- Добавь это -->
            <div class="overlay" id="formOverlay">
                <div class="form-container">
                    <h2>Добавить вакансию</h2>
                    
                    <label>Название</label>
                    <input type="text" id="formTitle" placeholder="Введите название вакансии">
                    
                    <div class="field-row">
                        <div>
                            <label>Требуемый опыт (лет)</label>
                            <input type="number" id="formExperience" placeholder="0">
                        </div>
                        <label class="checkbox-right">
                            <input type="checkbox" id="formExperienceMandatory">
                            Обязателен
                        </label>
                    </div>
                    
                    <div class="field-row">
                        <div>
                            <label>Требуемое образование</label>
                            <select type="text" id="formEducation">
                                <option value="Высшее профильное">Высшее профильное</option>
                                <option value="Среднее профильное">Среднее профильное</option>
                                <option value="Высшее непрофильное">Высшее непрофильное</option>
                                <option value="Среднее непрофильное">Среднее непрофильное</option>
                                <option value="Без образования">Без образования</option>
                            </select>
                        </div>
                        <label class="checkbox-right">
                            <input type="checkbox" id="formEducationMandatory">
                            Обязательно
                        </label>
                    </div>

                    
                    <label>Обязательные навыки</label>
                    <input type="text" id="formSkills" placeholder="Python, SQL, Excel">

                    <label>Желательные навыки</label>
                    <input type="text" id="formPrefSkills" placeholder="Git, HTML, js">
                    
                    <div class="field-row">
                        <div>
                            <label>Зарплата</label>
                            <input type="number" min="0" max="10000000" id="formSalary" placeholder="50000">
                        </div>
                        <label class="checkbox-right">
                            <input type="checkbox" id="formSalaryMandatory">
                            Обязательна
                        </label>
                    </div>
                    
                    <div class="field-row">
                        <label id="relocationLabel">
                            <input type="checkbox" id="formRelocation">
                            Нужен переезд?
                        </label>
                        <label class="checkbox-right">
                            <input type="checkbox" id="formRelocationMandatory">
                            Обязателен
                        </label>
                    </div>
                    
                    <div class="form-buttons">
                        <button type="button" id="formSubmit">Добавить</button>
                        <button type="button" id="formCancel">Отмена</button>
                    </div>
                </div>
            </div>

            <button onclick="add_vacancy()">Добавить вакансию</button>
        </div>
    </main>
    <script src="../scripts/vacancies.js"></script>
</body>
</html>
